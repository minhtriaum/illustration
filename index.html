<style>

</style></head><body><main>
<h1>삽화 추출기 (2개 언어) <span id="ver" style="font-size:12px;color:var(--mu);font-weight:400">v261008_1223</span> <button class="sec" id="rnb" style="padding:4px 10px;font-size:12px;margin-left:6px">릴리즈 노트</button></h1>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/\s+/g,' ').trim();
let pairs=null,docs=[];

/* ---------- 항 번호 / 일자 ---------- */
function nums(s){const out=[];String(s).split(/\s*,\s*/).forEach(p=>{const m=p.match(/^(\d+)\s*[-–~]\s*(\d+)$/);
  if(m){for(let i=+m[1];i<=+m[2]&&i-m[1]<30;i++)out.push(i)}else if(/^\d+$/.test(p.trim()))out.push(+p)});return out}
const NUMLIST=/\d+(?:\s*[-–~]\s*\d+)?(?:\s*,\s*\d+(?:\s*[-–~]\s*\d+)?)*/;
function refOf(cap){const m=cap.match(/\(([^()]*)\)\s*[*_]*$/);if(!m||!/\d/.test(m[1]))return[];const n=m[1].match(NUMLIST);return n?nums(n[0]):[]}
const DS=['\\d{4}년\\s*\\d{1,2}월\\s*\\d{1,2}일?(?:\\s*[-–~]\\s*(?:\\d{1,2}월\\s*)?\\d{1,2}일?)?',
 '[A-Za-z]{3,9}\\.?\\s+\\d{1,2}(?:\\s*[-–~]\\s*(?:[A-Za-z]{3,9}\\.?\\s+)?\\d{1,2})?,?\\s*\\d{4}',
 '\\d{1,2}(?:\\s*[-–~]\\s*\\d{1,2})?\\s+[A-Za-z]{3,9}\\.?(?:\\s*[-–~]\\s*\\d{1,2}\\s+[A-Za-z]{3,9}\\.?)?,?\\s*\\d{4}'];
const DFULL=DS.map(x=>new RegExp('^'+x+'$')),DANY=DS.map(x=>new RegExp(x));
function findDate(texts,loose){
  for(const t of texts){const x=norm(t);if(x.length<50&&DFULL.some(r=>r.test(x)))return x}
  for(const t of loose||[]){const x=norm(t);for(const r of DANY){const m=x.match(r);if(m)return m[0]}}
  return '';
}

/* ---------- 분석 ---------- */
function langName(code){if(!code)return '';try{return new Intl.DisplayNames(['ko'],{type:'language'}).of(code.split('-')[0])||code}catch(e){return code}}
const IMG_RE=/\.(?:jpe?g|png|gif|webp|avif|svg)(?:[?#]|$)/i;
function imgCands(f,base){
  const out=[];
  const add=v=>{v=String(v||'').trim();if(!v||/^data:/i.test(v))return;
    try{v=new URL(v,base||undefined).href}catch(e){return}
    if(!out.includes(v))out.push(v)};
  const els=[f,...f.querySelectorAll('*')];
  const i0=f.querySelector('img');if(i0){add(i0.getAttribute('src'));add(i0.getAttribute('data-src'))}
  ['data-img-size-lg','data-img-size-md','data-img-size-sm','data-img-size-xs'].forEach(a=>els.forEach(e=>add(e.getAttribute(a))));
  els.forEach(e=>{
    if(e.tagName==='IMG'||e.tagName==='SOURCE'){
      ['src','data-src','data-original','data-lazy-src'].forEach(a=>add(e.getAttribute(a)));
      const ss=e.getAttribute('srcset')||e.getAttribute('data-srcset');
      if(ss)ss.split(',').map(x=>x.trim().split(/\s+/)[0]).reverse().forEach(add);
    }
  });
  els.forEach(e=>{for(const a of e.attributes||[]){if(/^(href|data-zoom|data-img|data-url)/i.test(a.name)&&IMG_RE.test(a.value))add(a.value)}});
  return out;
}
function analyzeHTML(html,base){
  const d=new DOMParser().parseFromString(html,'text/html');
  const title=norm((d.querySelector('h1')||d.querySelector('title')||{}).textContent);
  const metas=[...d.querySelectorAll('meta[name=description],meta[property="og:description"],meta[name="og:description"]')].map(m=>m.getAttribute('content')||'');
  const date=findDate([...d.querySelectorAll('h1,h2,h3,h4,p,strong,span,div')].map(e=>e.textContent),metas);
  const figs=[...d.querySelectorAll('figure')].map(f=>{
    const img=f.querySelector('img'),cap=f.querySelector('figcaption');
    let srcs=imgCands(f,base);
    if(!srcs.length&&f.parentElement&&f.parentElement.querySelectorAll('figure').length===1)srcs=imgCands(f.parentElement,base);
    const caption=norm(cap&&cap.textContent);
    return {caption,alt:norm(img&&(img.getAttribute('alt')||img.getAttribute('data-alt'))),src:srcs[0]||'',srcs,ns:refOf(caption)};
  }).filter(f=>f.caption||f.alt);
  return {title,date,lang:d.documentElement.getAttribute('lang')||'',figs};
}
function analyzeText(txt){
  const lines=txt.split(/\n/).map(norm).filter(Boolean);
  const figs=lines.filter(l=>l.length<400&&!/^\d+\.?\s/.test(l)&&/\((?:[^()]*?(?:항|참조|paragraph|par\.|see)[^()]*)\)\s*[*_]*$/i.test(l))
    .map(l=>{const caption=l.replace(/^[*_\s]+|[*_\s]+$/g,'');return {caption,alt:'',src:'',srcs:[],ns:refOf(caption)}});
  return {title:lines[0]||'',date:findDate(lines),lang:'',figs};
}
function parse(raw,url){return /<(figure|figcaption|p|div|html)[\s>]/i.test(raw)?analyzeHTML(raw,url):analyzeText(raw)}

/* ---------- 불러오기 ---------- */
const PROXIES=[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u)];
async function fetchPage(u,k){
  let last;
  for(let i=0;i<PROXIES.length;i++){
    try{
      $('#fmsg').textContent='링크 '+k+(i?' 중계 서비스로 다시 시도 중… ('+i+'/'+(PROXIES.length-1)+')':' 불러오는 중…');
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
      const r=await fetch(PROXIES[i](u),{signal:ctl.signal});clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const t=await r.text();
      if(/<(figure|p)[\s>]/i.test(t))return t;
      throw new Error('본문 없음');
    }catch(e){last=e}
  }
  throw last;
}
async function load(k){
  const url=$('#url'+k).value.trim(),paste=$('#src'+k).value;
  let raw=paste.trim()?paste:null;
  if(!raw&&url){if(!/^https?:\/\//.test(url))throw new Error('http(s) 링크가 필요합니다');raw=await fetchPage(url,k)}
  return raw?parse(raw,url):null;
}

/* ---------- 짝짓기 / 표시 ---------- */
function pair(A,B){
  const rows=[],used=new Set();
  if(!B){A.figs.forEach(a=>rows.push({a,b:null}));return rows}
  A.figs.forEach((a,i)=>{
    let j=a.ns.length?B.figs.findIndex((b,x)=>!used.has(x)&&b.ns[0]===a.ns[0]):-1;
    if(j<0&&i<B.figs.length&&!used.has(i))j=i;
    if(j>=0)used.add(j);
    rows.push({a,b:j>=0?B.figs[j]:null});
  });
  B.figs.forEach((b,x)=>{if(!used.has(x))rows.push({a:null,b})});
  return rows;
}
function labels(ds){
  let l=ds.map((d,i)=>d?(langName(d.lang)||'언어 '+(i+1)):'');
  if(l[0]&&l[0]===l[1]){l[0]+=' 1';l[1]+=' 2'}return l;
}
function imgFail(el){
  let rest=[];try{rest=JSON.parse(el.getAttribute('data-alts')||'[]')}catch(e){}
  if(rest.length){const n=rest.shift();el.setAttribute('data-alts',JSON.stringify(rest));el.src=n;return}
  let all=[];try{all=JSON.parse(el.getAttribute('data-all')||'[]')}catch(e){}
  const p=document.createElement('p');p.className='note';p.textContent='이미지를 불러오지 못했습니다. 시도한 주소:';
  all.slice(0,6).forEach(u=>{const d=document.createElement('div');d.style.cssText='font-size:11px;word-break:break-all';
    const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent=u;d.appendChild(a);p.appendChild(d)});
  el.replaceWith(p);
}
function imgTag(list){list=[...new Set((list||[]).filter(Boolean))];if(!list.length)return '';
  return '<img src="'+esc(list[0])+'" referrerpolicy="no-referrer" onerror="imgFail(this)" data-all="'+esc(JSON.stringify(list))+'" data-alts="'+esc(JSON.stringify(list.slice(1)))+'" alt="" style="width:100%;border-radius:8px;display:block;margin-top:8px">'}
function isMerged(p){return $('#opt1').checked}
function hangOf(ds,ls){return ds.some((d,i)=>/[가-힣]/.test(ls[i]||'')||/^ko/i.test(d.lang||''))?'항':''}
function col(lg,f,showImg){
  if(!f)return '<div class="col"><div class="lg">'+esc(lg)+'</div><p class="v" style="color:var(--mu)">대응하는 삽화 없음</p></div>';
  return '<div class="col"><div class="lg">'+esc(lg)+'</div>'+(showImg?imgTag(f.srcs):'')+'<div class="k">캡션</div><p class="v cap">'+esc(f.caption||'(없음)')+'</p>'
    +(f.alt?'<div class="k">삽화 설명</div><p class="v">'+esc(f.alt)+'</p>':'')+'</div>';
}
function render(){
  const [A,B]=docs,[la,lb]=labels(docs);
  const hd=(docs.find(d=>d.date)||{}).date,hang=hangOf(docs,[la,lb]);
  let h='<div class="card">'+(hd?'<div style="font-size:17px;font-weight:700;color:var(--ac);margin-bottom:10px">연구기사 '+esc(hd)+'</div>':'');
  [[A,la],[B,lb]].forEach(([d,l])=>{if(d)h+='<div style="margin-bottom:10px"><div class="lg">['+esc(l)+']</div><div><b>'+esc(d.title)+'</b></div></div>'});
  h+='<p class="note" style="margin:4px 0 0">삽화 '+pairs.length+'개</p></div>';
  pairs.forEach((p,i)=>{
    const ns=(p.a&&p.a.ns.length?p.a:p.b||{ns:[]}).ns,m=isMerged(p),s0=(p.a&&p.a.src)||(p.b&&p.b.src);
    h+='<div class="card"><h3 style="font-size:16px;margin:0 0 8px"><span class="tag">삽화'+(i+1)+(ns.length?' ('+esc(ns.join(', '))+hang+')':'')+'</span></h3>'
      +(m&&s0?'<div class="imgs">'+imgTag([...(p.a?p.a.srcs:[]),...(p.b?p.b.srcs:[])])+'</div>':'')
      +'<div class="cols">'+col(la||'언어 1',p.a,!m)+(B?col(lb||'언어 2',p.b,!m):'')+'</div></div>';
  });
  $('#out').innerHTML=h;$('#tools').style.display='flex';$('#msg').textContent='';
}
function toText(){
  const [A,B]=docs,[la,lb]=labels(docs),hang=hangOf(docs,[la,lb]);
  const hd=(docs.find(d=>d.date)||{}).date;
  let t=hd?'연구기사 '+hd+'\n\n':'';
  [[A,la],[B,lb]].forEach(([d,l])=>{if(d)t+='['+l+']\n'+d.title+'\n\n'});
  pairs.forEach((p,i)=>{
    const ns=(p.a&&p.a.ns.length?p.a:p.b||{ns:[]}).ns;
    t+='## 삽화'+(i+1)+(ns.length?' ('+ns.join(', ')+hang+')':'')+'\n';
    if(p.a)t+='['+la+'] '+p.a.caption+(p.a.alt?'\n  설명: '+p.a.alt:'')+'\n';
    if(p.b)t+='['+lb+'] '+p.b.caption+(p.b.alt?'\n  설명: '+p.b.alt:'')+'\n';
    const s=(p.a&&p.a.src)||(p.b&&p.b.src);if(s)t+='이미지: '+s+'\n';
    t+='\n';
  });
  return t.trimEnd()+'\n';
}
function show(t){$('#out').innerHTML='<div class="card empty">'+esc(t)+'</div>';$('#tools').style.display='none'}


/* ---------- 표 이미지 ---------- */
const FONT='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
const imgCache={};
function loadUrl(u){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';const t=setTimeout(()=>res(null),25000);
  im.onload=()=>{clearTimeout(t);res(im)};im.onerror=()=>{clearTimeout(t);res(null)};im.src=u})}
async function getAny(list){for(const u of [...new Set(list||[])].slice(0,6)){const im=await getImg(u);if(im)return im}return null}
async function getImg(src){
  if(!src)return null;if(src in imgCache)return imgCache[src];
  let im=await loadUrl(src);
  for(let i=1;!im&&i<PROXIES.length;i++){
    try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);const r=await fetch(PROXIES[i](src),{signal:ctl.signal});clearTimeout(to);if(!r.ok)continue;const b=await r.blob();if(!/^image\//.test(b.type))continue;im=await loadUrl(URL.createObjectURL(b))}catch(e){}
  }
  return imgCache[src]=im;
}
function wrap(ctx,text,maxW){
  const out=[];let line='';const push=()=>{out.push(line.trimEnd());line=''};
  for(const tok of String(text).split(/(\s+)/)){
    if(!tok)continue;
    if(ctx.measureText(line+tok).width<=maxW){line+=tok;continue}
    if(line.trim())push();
    if(/^\s+$/.test(tok))continue;
    if(ctx.measureText(tok).width<=maxW){line=tok;continue}
    for(const ch of tok){if(ctx.measureText(line+ch).width>maxW&&line)push();line+=ch}
  }
  if(line.trim())push();
  return out.length?out:[''];
}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getFullYear()%100)+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())}
async function buildTable(){
  const [A,B]=docs,[la,lb]=labels(docs);
  const entries=[[A,la],[B,lb]].filter(x=>x[0]);
  const IM=await Promise.all(pairs.map(async p=>{
    const m=isMerged(p),sa=p.a?p.a.srcs:[],sb=p.b?p.b.srcs:[];
    if(m)return {one:await getAny([...sa,...sb])};
    return {a:await getAny(sa),b:await getAny(sb)};
  }));
  const W=1200,P=28,langs=B?2:1,anyM=pairs.some(isMerged),c0=anyM?340:96,cw=(W-2*P-c0)/langs;
  const hang=entries.some(([d,l])=>/[가-힣]/.test(l||'')||/^ko/i.test(d.lang||''))?'항':'';
  const x0=P,x1=P+c0,x2=P+c0+cw,INK='#1d1d1b',MU='#6b6b66',AC='#2f5d8a',BD='#d8d8d2';
  function pass(ctx,dr,M){
    ctx.textBaseline='top';let y=0;
    if(dr){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,M.H);ctx.fillStyle=AC;ctx.fillRect(0,0,W,M.hdr)}
    y=P;
    const hd=(entries.find(x=>x[0].date)||[{}])[0].date;
    if(hd){ctx.font='700 28px '+FONT;if(dr){ctx.fillStyle='#fff';ctx.fillText('연구기사 '+hd,P,y)}y+=50}
    for(const [d,l] of entries){
      ctx.font='700 20px '+FONT;
      if(dr){ctx.fillStyle='#cfe0f1';ctx.fillText('['+l+']',P,y)}
      y+=30;ctx.font='700 30px '+FONT;
      for(const ln of wrap(ctx,d.title,W-2*P)){if(dr){ctx.fillStyle='#fff';ctx.fillText(ln,P,y)}y+=42}
      y+=18;
    }
    y+=P-18;M.hdr=y;
    if(dr){ctx.fillStyle='#eef3f8';ctx.fillRect(P,y,W-2*P,46);ctx.fillStyle=AC;ctx.font='700 20px '+FONT;
      ctx.fillText('삽화',x0+12,y+12);ctx.fillText(la,x1+12,y+12);if(B)ctx.fillText(lb,x2+12,y+12)}
    y+=46;
    const drawImg=(im,x,w,cy)=>{let h;
      if(im){h=Math.round(w*im.height/im.width);if(dr)ctx.drawImage(im,x,cy,w,h)}
      else{h=110;if(dr){ctx.fillStyle='#f0f0ec';ctx.fillRect(x,cy,w,h);ctx.fillStyle=MU;ctx.font='18px '+FONT;ctx.fillText('이미지를 불러오지 못했습니다',x+12,cy+44)}}
      return cy+h+10};
    const txt=(lines,x,cy,lh,color)=>{for(const ln of lines){if(dr){ctx.fillStyle=color;ctx.fillText(ln,x,cy)}cy+=lh}return cy};
    pairs.forEach((p,i)=>{
      const top=y,m=isMerged(p),ns=(p.a&&p.a.ns.length?p.a:p.b||{ns:[]}).ns,s0=(p.a&&p.a.src)||(p.b&&p.b.src);
      let c=top+12;
      ctx.font='700 22px '+FONT;
      c=txt(wrap(ctx,'삽화'+(i+1)+(ns.length?' ('+ns.join(', ')+hang+')':''),c0-24),x0+12,c,30,AC);
      if(m&&s0)c=drawImg(IM[i].one,x0+12,c0-24,c+4);
      let bottom=c;
      [[p.a,x1],[p.b,x2]].slice(0,langs).forEach(([f,x])=>{
        let cy=top+12;const w=cw-24;
        if(!f){ctx.font='italic 18px '+FONT;cy=txt(['대응하는 삽화 없음'],x+12,cy,28,MU)}
        else{
          if(!m&&f.src)cy=drawImg(f===p.a?IM[i].a:IM[i].b,x+12,w,cy);
          ctx.font='italic 20px '+FONT;cy=txt(wrap(ctx,f.caption||'(없음)',w),x+12,cy,30,INK)+6;
          if(f.alt){ctx.font='17px '+FONT;cy=txt(wrap(ctx,f.alt,w),x+12,cy,26,MU)}
        }
        bottom=Math.max(bottom,cy);
      });
      y=bottom+12;
      if(dr){ctx.strokeStyle=BD;ctx.lineWidth=1;ctx.beginPath();
        ctx.moveTo(P,y);ctx.lineTo(W-P,y);
        [P,x1,langs>1?x2:null,W-P].forEach(x=>{if(x!=null){ctx.moveTo(x,top);ctx.lineTo(x,y)}});ctx.stroke()}
    });
    y+=16;ctx.font='16px '+FONT;
    if(dr){ctx.fillStyle=MU;ctx.fillText('생성 '+stamp(),P,y)}
    y+=40;M.H=y;
  }
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d'),M={};
  cv.width=W;cv.height=10;pass(ctx,false,M);
  let sc=2;while(W*sc*M.H*sc>14e6&&sc>1)sc-=0.25;
  cv.width=Math.round(W*sc);cv.height=Math.round(M.H*sc);ctx.scale(sc,sc);
  pass(ctx,true,M);
  return new Promise((res,rej)=>{try{cv.toBlob(b=>b?res(b):rej(new Error('변환 실패')),'image/png')}catch(e){rej(e)}});
}
function showShot(blob){
  const name='삽화표_'+stamp()+'.png',url=URL.createObjectURL(blob),file=new File([blob],name,{type:'image/png'});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  $('#shotbox').innerHTML='<div class="card"><img src="'+url+'" alt="표 이미지" style="width:100%;border:1px solid var(--bd);border-radius:8px;display:block">'
    +'<div class="row">'+(canShare?'<button id="shr">공유</button>':'')+'<button class="sec" id="sav">이미지 저장</button></div>'
    +'<p class="note">'+esc(name)+(canShare?'':' · 이 브라우저는 공유를 지원하지 않아 저장만 가능합니다. 이미지를 길게 눌러 저장할 수도 있습니다.')+'</p></div>';
  if(canShare)$('#shr').onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});
  $('#sav').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
  $('#shotbox').scrollIntoView({behavior:'smooth'});
}

$('#go').onclick=async()=>{
  $('#go').disabled=true;const errs=[],res=[];
  for(const k of ['1','2']){try{res.push(await load(k))}catch(e){res.push(null);errs.push('링크 '+k+': '+e.message)}}

  const [A,B]=docs;
  if(!A.figs.length&&!(B&&B.figs.length)){show('삽화(figure)/figcaption을 찾지 못했습니다.');return}
  pairs=pair(A,B||null);render();
  $('#fmsg').textContent=errs.length?errs.join(' / '):'완료';
};

};

  if(!pairs)return;const t=toText();

    try{document.execCommand('copy');$('#msg').textContent='복사됨'}catch(_){$('#msg').textContent='복사 실패'}a.remove()}
};
